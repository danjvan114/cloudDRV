<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>公告 - CloudDrive</title>
    <link href="https://cdn.jsdelivr.net/npm/mdui@1.0.2/dist/css/mdui.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/mdui@1.0.2/dist/icons/material-icons.min.css" rel="stylesheet">
    <link rel="icon" href="{{ url_for('static', filename='kecloud.png') }}" type="image/png">
    <style>
        body { background: #f5f5f5; min-height: 100vh; }
        .announcement-card {
            max-width: 800px; margin: 40px auto; background: white;
            border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            padding: 40px;
        }
        .announcement-item {
            padding: 16px; border-bottom: 1px solid #e0e0e0;
            cursor: pointer; transition: background 0.2s; border-radius: 8px;
        }
        .announcement-item:hover { background: #f5f5f5; }
        .announcement-item:last-child { border-bottom: none; }
        .announcement-title { font-size: 16px; font-weight: 500; color: #333; }
        .announcement-time { font-size: 12px; color: #999; margin-top: 4px; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 4px;
            color: #1976d2; text-decoration: none; margin-bottom: 20px;
            font-size: 14px; cursor: pointer;
        }
        .back-btn:hover { opacity: 0.8; }
        .empty-tip { text-align: center; color: #999; padding: 40px 0; }
    </style>
</head>
<body>
    <div class="announcement-card">
        <a class="back-btn" href="javascript:history.back()">
            <i class="mdui-icon material-icons">arrow_back</i> 返回
        </a>
        <h2 style="margin: 0 0 24px 0; color: #333;">公告列表</h2>
        <div id="announcement-list">
            <div class="empty-tip">加载中...</div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/mdui@1.0.2/dist/js/mdui.min.js"></script>
    <script>
        var xhr = new XMLHttpRequest();
        xhr.open('GET', '/api/announcements', true);
        xhr.onload = function() {
            if (xhr.status === 200) {
                var list = JSON.parse(xhr.responseText);
                var container = document.getElementById('announcement-list');
                if (list.length === 0) {
                    container.innerHTML = '<div class="empty-tip">暂无公告</div>';
                    return;
                }
                var html = '';
                for (var i = 0; i < list.length; i++) {
                    html += '<div class="announcement-item" onclick="location.href=\'/policy/' + list[i].file + '\'">' +
                        '<div class="announcement-title">' + list[i].name + '</div>' +
                        '</div>';
                }
                container.innerHTML = html;
            }
        };
        xhr.send();
    </script>
</body>
</html>
