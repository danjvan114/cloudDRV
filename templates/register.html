<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mdui@1.0.2/dist/css/mdui.min.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 450px;
            width: 100%;
        }
        .register-card h2 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
        }
        .btn-register {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-register:hover { opacity: 0.9; }
        .login-link { text-align: center; margin-top: 20px; }
        .code-row { display: flex; gap: 10px; align-items: flex-end; }
        .code-row .mdui-textfield { flex: 1; }
        .code-row .mdui-btn { white-space: nowrap; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="register-card">
        <h2><i class="bi bi-cloud-fill"></i> 注册账号</h2>
        
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages %}
        <div class="mdui-alert mdui-color-blue-50 mdui-text-color-blue" style="margin-bottom:16px;border-radius:8px;">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}
        
        <form method="POST">
            <div class="mdui-textfield mdui-textfield-floating-label" style="margin-bottom:20px;">
                <label class="mdui-textfield-label">用户名</label>
                <input class="mdui-textfield-input" type="text" name="username" required>
            </div>
            <div class="code-row">
                <div class="mdui-textfield mdui-textfield-floating-label">
                    <label class="mdui-textfield-label">邮箱</label>
                    <input class="mdui-textfield-input" type="email" id="email" name="email" required>
                </div>
                <button type="button" class="mdui-btn mdui-ripple mdui-color-theme-accent" onclick="sendCode()" id="sendCodeBtn">获取验证码</button>
            </div>
            <div class="mdui-textfield mdui-textfield-floating-label" style="margin-bottom:20px;">
                <label class="mdui-textfield-label">验证码</label>
                <input class="mdui-textfield-input" type="text" name="verification_code" required maxlength="6">
            </div>
            <div class="mdui-textfield mdui-textfield-floating-label" style="margin-bottom:20px;">
                <label class="mdui-textfield-label">密码</label>
                <input class="mdui-textfield-input" type="password" name="password" required>
            </div>
            <div class="mdui-textfield mdui-textfield-floating-label" style="margin-bottom:20px;">
                <label class="mdui-textfield-label">确认密码</label>
                <input class="mdui-textfield-input" type="password" name="confirm_password" required>
            </div>
            <button type="submit" class="mdui-btn mdui-btn-raised mdui-ripple mdui-color-theme-accent btn-register">注册</button>
        </form>
        
        <div class="login-link">
            <a href="{{ url_for('login') }}" class="mdui-text-color-theme">已有账号？立即登录</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/mdui@1.0.2/dist/js/mdui.min.js"></script>
    <script>
        let countdown = 0;
        function sendCode() {
            if (countdown > 0) return;
            
            const email = document.getElementById('email').value;
            if (!email) {
                mdui.snackbar({ message: '请先输入邮箱', timeout: 3000 });
                return;
            }
            
            const btn = document.getElementById('sendCodeBtn');
            btn.disabled = true;
            
            fetch('/send_code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    mdui.snackbar({ message: '验证码已发送', timeout: 3000 });
                    countdown = 60;
                    btn.textContent = countdown + 's';
                    const timer = setInterval(() => {
                        countdown--;
                        btn.textContent = countdown + 's';
                        if (countdown <= 0) {
                            clearInterval(timer);
                            btn.disabled = false;
                            btn.textContent = '获取验证码';
                        }
                    }, 1000);
                } else {
                    mdui.snackbar({ message: data.message, timeout: 3000 });
                    btn.disabled = false;
                }
            })
            .catch(() => {
                mdui.snackbar({ message: '发送失败', timeout: 3000 });
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
