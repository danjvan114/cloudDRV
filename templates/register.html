<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - CloudDrive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .register-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 450px;
            width: 100%;
        }
        .register-card h2 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
        }
        .btn-register {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
        }
        .btn-register:hover { opacity: 0.9; color: white; }
        .login-link { text-align: center; margin-top: 20px; }
        .code-group { display: flex; gap: 10px; }
        .code-group input { flex: 1; }
        .code-group button { white-space: nowrap; }
    </style>
</head>
<body>
    <div class="register-card">
        <h2><i class="bi bi-cloud-fill"></i> 注册账号</h2>
        
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages %}
        <div class="alert alert-info">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}
        
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">用户名</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">邮箱</label>
                <div class="code-group">
                    <input type="email" id="email" name="email" class="form-control" required>
                    <button type="button" class="btn btn-outline-primary" onclick="sendCode()">获取验证码</button>
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label">验证码</label>
                <input type="text" name="verification_code" class="form-control" required maxlength="6">
            </div>
            <div class="mb-3">
                <label class="form-label">密码</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">确认密码</label>
                <input type="password" name="confirm_password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-register">注册</button>
        </form>
        
        <div class="login-link">
            <a href="{{ url_for('login') }}">已有账号？立即登录</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let countdown = 0;
        function sendCode() {
            if (countdown > 0) return;
            
            const email = document.getElementById('email').value;
            if (!email) {
                alert('请先输入邮箱');
                return;
            }
            
            fetch('/send_code', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email: email})
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                if (data.success) {
                    countdown = 60;
                    updateButton();
                }
            });
        }
        
        function updateButton() {
            const btn = document.querySelector('.code-group button');
            if (countdown > 0) {
                btn.textContent = countdown + 's';
                btn.disabled = true;
                countdown--;
                setTimeout(updateButton, 1000);
            } else {
                btn.textContent = '获取验证码';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
