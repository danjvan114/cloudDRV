<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - CloudDrive</title>
    <link rel="icon" href="{{ url_for('static', filename='kecloud.png') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mdui@1.0.2/dist/css/mdui.min.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background: #f5f5f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 400px;
            width: 100%;
        }
        .login-card h2 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
        }
        .btn-login {
            background: #667eea;
            color: white;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            border: none;
            cursor: pointer;
            font-size: 16px;
        }
        .btn-login:hover { opacity: 0.9; }
        .register-link { text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2><i class="bi bi-cloud-fill"></i> CloudDrive</h2>
        
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages %}
        <div class="mdui-alert mdui-color-blue-50 mdui-text-color-blue" style="margin-bottom:16px;border-radius:8px;">{{ message }}</div>
        {% endfor %}
        {% endif %}
        {% endwith %}
        


        



        <form method="POST">
            <div class="mdui-textfield mdui-textfield-floating-label" style="margin-bottom:20px;">
                <label class="mdui-textfield-label">用户名</label>
                <input class="mdui-textfield-input" type="text" name="username" required>
            </div>
            <div class="mdui-textfield mdui-textfield-floating-label" style="margin-bottom:20px;">
                <label class="mdui-textfield-label">密码</label>
                <input class="mdui-textfield-input" type="password" name="password" required>
            </div>
            <button type="submit" class="mdui-btn mdui-btn-raised mdui-ripple mdui-color-theme-accent btn-login">登录</button>
        </form>
        
        <div class="register-link">
            <a href="{{ url_for('register') }}" class="mdui-text-color-theme">还没有账号？立即注册</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/mdui@1.0.2/dist/js/mdui.min.js"></script>
</body>
</html>
