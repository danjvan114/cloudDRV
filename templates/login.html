<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <!-- MDUI 1.0.2 固定CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mdui@1.0.2/dist/css/mdui.min.css"/>
    <!-- 图标采用MDUI内置图标，无需额外bootstrap-icons -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #f6f6f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
        }
        /* 登录卡片容器 */
        .cloud-login-card {
            width: 100%;
            max-width: 620px;
            background: #ffffff;
            border-radius: 16px;
            padding: 36px 40px;
            position: relative;
        }
        /* 顶部logo+标题行 */
        .login-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }
        .logo-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #e8f4ff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .logo-circle i {
            font-size: 24px;
            color: #2185eb;
        }
        .login-header h1 {
            font-size: 26px;
            font-weight: 600;
            color: #111111;
        }
        .lang-switch {
            position: absolute;
            top: 36px;
            right: 40px;
            font-size: 20px;
            color: #666;
            cursor: pointer;
        }
        /* 登录标题 */
        .login-title {
            font-size: 28px;
            font-weight: 500;
            color: #1a1a1a;
            margin-bottom: 28px;
        }
        /* 输入框自定义 */
        .email-input {
            margin-bottom: 28px;
        }
        .email-input .mdui-textfield-input {
            height: 54px;
            font-size: 17px;
            padding-left: 12px;
        }
        /* 下一步主按钮 */
        .btn-next {
            width: 100%;
            height: 54px;
            background-color: #217ee8;
            color: #fff;
            font-size: 18px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-next:hover {
            opacity: 0.92;
        }
        /* 注册链接区域 */
        .register-tip {
            text-align: center;
            margin: 24px 0 30px;
            font-size: 16px;
            color: #444;
        }
        .register-tip a {
            color: #217ee8;
            text-decoration: none;
        }
        /* 通行密钥按钮 */
        .btn-passkey {
            width: 100%;
            height: 52px;
            border: 1px solid #217ee8;
            background: #fff;
            color: #217ee8;
            border-radius: 12px;
            font-size: 17px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            cursor: pointer;
            margin-bottom: 36px;
        }
        /* 底部协议与联系方式 */
        .bottom-tips {
            text-align: center;
            font-size: 14px;
            color: #777;
        }
        .bottom-tips a {
            color: #777;
            text-decoration: none;
        }
        .contact-mail {
            margin-top: 8px;
            font-size: 18px;
            color: #222;
        }
        /* 页脚Poweredby */
        .page-footer {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: #aaa;
            font-size: 15px;
        }
        .m2{
            border-style: solid;
            border-color: #217ee8;
            border-radius: 10px;
            width: 100%;
            height: 54px;
        }
    </style>
</head>
<body>
    <div class="cloud-login-card">
        <!-- 语言切换按钮 -->
        <span class="lang-switch mdui-icon">aⱥ</span>
        <!-- Logo 头部 -->
        <div class="login-header">
            <div class="logo-circle">
                <img src="{{ url_for('static', filename='img/kecloud.png') }}" alt="Logo" style="width: 24px; height: 24px;">
            </div>
            <h1>云存储</h1>
        </div>

        <!-- 闪现消息提示框 jinja2 模板 -->
        {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for msg in messages %}
                <div class="mdui-alert mdui-color-blue-50 mdui-text-color-blue" style="border-radius:10px;margin-bottom:20px;padding:12px;">
                    {{ msg }}
                </div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <h2 class="login-title">登录你的账号</h2>

        <form method="POST">
            <!-- 邮箱输入框 -->
            <div class="">
                <div style="box-sizing:border-box;"><label style="display:inline-flex;align-items:center;gap:5px;margin:0;padding:0;"><i class="mdui-icon material-icons">account_circle</i>用户名</label></div>
                
                <input class="m2" type="text" required>
                  
                
                
            </div>
            <div style="height: 40px;width: 100%;"></div>
            












































            

            

            <!-- 下一步按钮 -->
            <button type="submit" class="btn-next">下一步</button>
        </form>

        <!-- 注册跳转 -->
        <div class="register-tip">
            还没有账号？<a href="{{ url_for('register') }}">立即注册</a>
        </div>

        

        <!-- 底部协议与联系邮箱 -->
        <div class="bottom-tips">
            <a href="#">使用条款</a> | <a href="#">隐私政策</a>
            
        </div>
    </div>

    <!-- 页脚版权标注 -->
    
    <!-- MDUI1.0.2 JS -->
    <script src="https://cdn.jsdelivr.net/npm/mdui@1.0.2/dist/js/mdui.min.js"></script>
</body>
</html>
