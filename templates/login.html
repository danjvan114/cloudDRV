<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <link rel="icon" href="{{ url_for('static', filename='kecloud.png') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mdui@1.0.2/dist/css/mdui.min.css"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #f6f6f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
        }
        .cloud-login-card {
            width: 100%;
            max-width: 620px;
            background: #ffffff;
            border-radius: 16px;
            padding: 36px 40px;
            position: relative;
        }
        .login-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }
        .logo-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #e8f4ff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .logo-circle img { width: 24px; height: 24px; }
        .login-header h1 { font-size: 26px; font-weight: 600; color: #111111; }
        .login-title { font-size: 28px; font-weight: 500; color: #1a1a1a; margin-bottom: 28px; }
        .m2 {
            border: 2px solid #217ee8;
            border-radius: 10px;
            width: 100%;
            height: 54px;
            padding: 0 14px;
            font-size: 17px;
            outline: none;
        }
        .m2:focus { border-color: #1565c0; }
        .btn-next {
            width: 100%;
            height: 54px;
            background-color: #217ee8;
            color: #fff;
            font-size: 18px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-next:hover { opacity: 0.92; }
        .btn-next:disabled { opacity: 0.5; cursor: not-allowed; }
        .register-tip { text-align: center; margin: 24px 0 30px; font-size: 16px; color: #444; }
        .register-tip a { color: #217ee8; text-decoration: none; }
        .bottom-tips { text-align: center; font-size: 14px; color: #777; }
        .bottom-tips a { color: #777; text-decoration: none; }
        /* 密码步骤 */
        #step2 { display: none; }
        .user-display {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
            padding: 12px 16px;
            background: #f0f7ff;
            border-radius: 10px;
        }
        .user-display i { color: #217ee8; font-size: 22px; }
        .user-display span { font-size: 17px; color: #333; font-weight: 500; }
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #217ee8;
            cursor: pointer;
            font-size: 15px;
        }
        .back-link:hover { text-decoration: underline; }
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="cloud-login-card">
        <div class="login-header">
            <div class="logo-circle">
                <img src="{{ url_for('static', filename='kecloud.png') }}" alt="Logo">
            </div>
            <h1>云存储</h1>
        </div>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for msg in messages %}
                <div class="mdui-alert mdui-color-red-50 mdui-text-color-red" style="border-radius:10px;margin-bottom:20px;padding:12px;">{{ msg }}</div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <!-- 第一步：输入用户名 -->
        <div id="step1">
            <h2 class="login-title">登录你的账号</h2>
            <div style="margin-bottom:28px;">
                <label style="display:inline-flex;align-items:center;gap:5px;margin-bottom:8px;">
                    <i class="mdui-icon material-icons">account_circle</i>用户名
                </label>
                <input class="m2" id="usernameInput" type="text" placeholder="请输入用户名" autocomplete="username">
            </div>
            <button type="button" class="btn-next mdui-ripple mdui-ripple-white" id="btnNext" onclick="checkUser()">下一步</button>
            <div class="register-tip">还没有账号？<a href="{{ url_for('register') }}">立即注册</a></div>
        </div>

        <!-- 第二步：输入密码 -->
        <div id="step2">
            <h2 class="login-title">输入密码</h2>
            <span class="back-link" onclick="goBack()"><i class="mdui-icon material-icons" style="font-size:18px;vertical-align:middle;">arrow_back</i> 返回</span>
            <div class="user-display">
                <i class="mdui-icon material-icons">person</i>
                <span id="displayName"></span>
            </div>
            <form method="POST" id="loginForm">
            <input type="hidden" name="backurl" value="{{ backurl }}">
            <input type="hidden" name="uuid" value="{{ uuid }}">
            <input type="hidden" name="username" id="hiddenUsername">
                <div style="margin-bottom:28px;">
                    <label style="display:inline-flex;align-items:center;gap:5px;margin-bottom:8px;">
                        <i class="mdui-icon material-icons">lock</i>密码
                    </label>
                    <input class="m2" name="password" type="password" placeholder="请输入密码" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn-next">登录</button>
            </form>
            <div class="register-tip">还没有账号？<a href="{{ url_for('register') }}">立即注册</a></div>
        </div>

        <div class="bottom-tips">
            <a href="{{ url_for('policy_page', filename='user.md') }}">使用条款</a> | <a href="{{ url_for('policy_page', filename='ys.md') }}">隐私政策</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/mdui@1.0.2/dist/js/mdui.min.js"></script>
    <script>
        function checkUser() {
            const username = document.getElementById('usernameInput').value.trim();
            if (!username) {
                mdui.snackbar({ message: '请输入用户名', timeout: 3000 });
                return;
            }
            const btn = document.getElementById('btnNext');
            btn.disabled = true;
            btn.innerHTML = '<span class="loading-spinner"></span>查询中...';

            fetch('/check_user', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username })
            })
            .then(res => res.json())
            .then(data => {
                btn.disabled = false;
                btn.innerHTML = '下一步';
                if (data.exists) {
                    document.getElementById('displayName').textContent = data.username;
                    document.getElementById('hiddenUsername').value = username;
                    document.getElementById('step1').style.display = 'none';
                    document.getElementById('step2').style.display = 'block';
                    document.querySelector('#step2 input[name="password"]').focus();
                } else {
                    mdui.snackbar({
                        message: '该用户不存在，即将跳转到注册页面...',
                        timeout: 2000,
                        onClosed: function() {
                            window.location.href = '/register?username=' + encodeURIComponent(username);
                        }
                    });
                }
            })
            .catch(() => {
                btn.disabled = false;
                btn.innerHTML = '下一步';
                mdui.snackbar({ message: '查询失败，请重试', timeout: 3000 });
            });
        }

        function goBack() {
            document.getElementById('step2').style.display = 'none';
            document.getElementById('step1').style.display = 'block';
            document.getElementById('usernameInput').focus();
        }

        // 回车键触发下一步
        document.getElementById('usernameInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                checkUser();
            }
        });
    </script>
</body>
</html>
