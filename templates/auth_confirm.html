<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>确认授权</title>
    <link rel="icon" href="{{ url_for('static', filename='kecloud.png') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mdui@1.0.2/dist/css/mdui.min.css"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background-color: #f6f6f6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: system-ui, -apple-system, "Microsoft YaHei", sans-serif;
        }
        .cloud-login-card {
            width: 100%;
            max-width: 620px;
            background: #ffffff;
            border-radius: 16px;
            padding: 36px 40px;
            position: relative;
        }
        .login-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }
        .logo-circle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #e8f4ff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .logo-circle img { width: 24px; height: 24px; }
        .login-header h1 { font-size: 26px; font-weight: 600; color: #111111; }
        .login-title { font-size: 28px; font-weight: 500; color: #1a1a1a; margin-bottom: 28px; }
        .btn-next {
            width: 100%;
            height: 54px;
            background-color: #217ee8;
            color: #fff;
            font-size: 18px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-next:hover { opacity: 0.92; }
        .btn-cancel {
            width: 100%;
            height: 54px;
            background-color: #f5f5f5;
            color: #666;
            font-size: 18px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 12px;
        }
        .btn-cancel:hover { opacity: 0.92; }
        .user-display {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 24px;
            padding: 12px 16px;
            background: #f0f7ff;
            border-radius: 10px;
        }
        .user-display i { color: #217ee8; font-size: 22px; }
        .user-display span { font-size: 17px; color: #333; font-weight: 500; }
        .auth-info {
            background: #f9f9f9;
            border-radius: 10px;
            padding: 16px;
            margin-bottom: 28px;
            font-size: 15px;
            color: #555;
            line-height: 1.6;
        }
        .auth-info strong { color: #333; }
    </style>
</head>
<body>
    <div class="cloud-login-card">
        <div class="login-header">
            <div class="logo-circle">
                <img src="{{ url_for('static', filename='kecloud.png') }}" alt="Logo">
            </div>
            <h1>云存储</h1>
        </div>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for msg in messages %}
                <div class="mdui-alert mdui-color-red-50 mdui-text-color-red" style="border-radius:10px;margin-bottom:20px;padding:12px;">{{ msg }}</div>
            {% endfor %}
        {% endif %}
        {% endwith %}

        <h2 class="login-title">确认授权</h2>

        <div class="user-display">
            <i class="mdui-icon material-icons">person</i>
            <span>{{ username }}</span>
        </div>

        <div class="auth-info">
            <strong>第三方应用</strong>请求授权其用户ID，以方便快速登录<br><br>
        </div>

        <form method="POST">
            <input type="hidden" name="uuid" value="{{ uuid }}">
            <input type="hidden" name="backurl" value="{{ backurl }}">
            <button type="submit" class="btn-next">确认授权</button>
        </form>
        <button type="button" class="btn-cancel" onclick="window.location.href='{{ url_for('index') }}'">取消</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/mdui@1.0.2/dist/js/mdui.min.js"></script>
</body>
</html>
